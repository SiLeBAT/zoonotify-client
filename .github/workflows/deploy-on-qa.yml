name: Deploy to QA (manual)

# Manual QA deploy from any branch. Primary use: stabilizing an rc-* branch
# before cutting a release (ADR 0001, step 3).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci

      - name: Set build date
        id: meta
        run: echo "builddate=$(date +'%Y-%m-%dT%H:%M:%S%z')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build:qa -- --env=lastChange=${{ steps.meta.outputs.builddate }}
      - run: npm run cp:all

      - uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qa-artifacts
          path: ./public

      - name: Deploy to QA (SSH, shared docroot)
        uses: ./.github/actions/ssh-deploy
        with:
          source-dir: ./public
          target-dir: ${{ vars.QA_DEPLOY_DIR }}
          ssh-host: ${{ secrets.QA_SSH_HOST }}
          ssh-port: ${{ vars.QA_SSH_PORT }}
          ssh-user: ${{ secrets.QA_SSH_USER }}
          ssh-key: ${{ secrets.QA_SSH_KEY }}
