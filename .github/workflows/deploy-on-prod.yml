name: Deploy to PROD

# Manual, tag-pinned production deploy (ADR 0001, step 6). Builds and deploys a
# specific release tag - never develop HEAD. The `production` environment gates
# the deploy job behind required reviewers (configured in repo Settings).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (e.g. v4.4.0)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci

      - name: Set build date
        id: meta
        run: echo "builddate=$(date +'%Y-%m-%dT%H:%M:%S%z')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build:prod -- --env=lastChange=${{ steps.meta.outputs.builddate }}
      - run: npm run cp:all

      - uses: actions/upload-artifact@v4
        with:
          name: prod-artifacts
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Required reviewers + prod secrets are scoped to this environment.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: prod-artifacts
          path: ./public

      - name: Deploy to PROD (SSH, shared docroot)
        uses: ./.github/actions/ssh-deploy
        with:
          source-dir: ./public
          target-dir: ${{ vars.PROD_DEPLOY_DIR }}
          ssh-host: ${{ secrets.PROD_SSH_HOST }}
          ssh-port: ${{ vars.PROD_SSH_PORT }}
          ssh-user: ${{ secrets.PROD_SSH_USER }}
          ssh-key: ${{ secrets.PROD_SSH_KEY }}
