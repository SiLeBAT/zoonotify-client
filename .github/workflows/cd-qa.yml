name: Continuous Delivery Workflow QA

# Auto-deploys develop to QA on every push. See ADR 0001 / 0002.
on:
  workflow_dispatch:
  push:
    branches:
      - develop

concurrency:
  group: deploy-qa
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci

      - name: Set build date and commit hash
        id: meta
        run: |
          echo "builddate=$(date +'%Y-%m-%dT%H:%M:%S%z')" >> "$GITHUB_OUTPUT"
          echo "commithash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # QA builds label themselves with the deployed commit instead of the
      # package version (the footer tooltip reads `client commit@<hash>`).
      - name: Build
        run: npm run build:qa -- --env=lastChange=${{ steps.meta.outputs.builddate }} --env=commitHash=${{ steps.meta.outputs.commithash }}
      # cross-env scopes NODE_ENV to the webpack process above, so cp:all needs
      # to be told separately, or the sitemap is built for the wrong host.
      - name: Copy static and crawler artifacts
        run: npm run cp:all
        env:
          NODE_ENV: qa

      - uses: actions/upload-artifact@v7
        with:
          name: qa-artifacts
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Checkout is needed so the local composite action is available.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: qa-artifacts
          path: ./public

      - name: Deploy to QA (SSH, shared docroot)
        uses: ./.github/actions/ssh-deploy
        with:
          source-dir: ./public
          target-dir: ${{ vars.QA_DEPLOY_DIR }}
          ssh-host: ${{ secrets.QA_SSH_HOST }}
          ssh-port: ${{ vars.QA_SSH_PORT }}
          ssh-user: ${{ secrets.QA_SSH_USER }}
          ssh-key: ${{ secrets.QA_SSH_KEY }}
