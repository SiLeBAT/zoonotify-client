name: Continuous Integration Workflow

# Runs on PRs to develop and on pushes to develop.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

# Cancel superseded runs on the same ref (e.g. a new push to an open PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 'Run linter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    name: 'Run unit tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --watchAll=false

  build:
    name: 'Build & type-check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # ts-loader type-checks during the webpack build, so this catches type
      # errors AND build breakage on the PR, before merge (previously these
      # surfaced only after merge, when cd-qa built).
      - run: npm run build

  # The API reference spec is generated in zoonotify-cms; this repo carries a
  # synced copy. Drift only warns, so CMS changes never block client PRs.
  api-docs-drift:
    name: 'Check API reference is in sync with the CMS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare with zoonotify-cms develop
        run: |
          url="https://raw.githubusercontent.com/SiLeBAT/zoonotify-cms/develop/api-reference/openapi.json"
          if ! curl -fsSL "$url" -o "$RUNNER_TEMP/cms-openapi.json"; then
            echo "::warning::Could not fetch $url; API reference drift not checked."
          elif ! cmp -s "$RUNNER_TEMP/cms-openapi.json" src/assets/api-docs/openapi.json; then
            echo "::warning file=src/assets/api-docs/openapi.json::The API reference differs from zoonotify-cms develop. Run 'npm run sync:api-docs -- develop' and commit."
          else
            echo "API reference matches zoonotify-cms develop."
          fi

  e2e:
    name: 'Run E2E tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck:e2e
      # Only the browser the suite actually uses -- `playwright install` with no
      # argument fetches firefox and webkit too, for nothing.
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts starts the dev server itself (start:e2e) and waits
      # for it. No CMS runs here: the suite covers routing, metadata and the
      # language contract, all of which the app shell renders on its own.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
