name: Continuous Integration Workflow

# Runs on PRs to develop and on pushes to develop.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

# Cancel superseded runs on the same ref (e.g. a new push to an open PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 'Run linter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    name: 'Run unit tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --watchAll=false

  build:
    name: 'Build & type-check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # ts-loader type-checks during the webpack build, so this catches type
      # errors AND build breakage on the PR, before merge (previously these
      # surfaced only after merge, when cd-qa built).
      - run: npm run build

  e2e:
    name: 'Run E2E tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck:e2e
      # Only the browser the suite actually uses -- `playwright install` with no
      # argument fetches firefox and webkit too, for nothing.
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts starts the dev server itself (start:e2e) and waits
      # for it. No CMS runs here: the suite covers routing, metadata and the
      # language contract, all of which the app shell renders on its own.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
